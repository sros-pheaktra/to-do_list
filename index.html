<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <style>
    :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --primary: #0078ff;
        --danger: #ff4d4d;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    div {
        width: 100%;
        max-width: 450px;
        background: var(--card);
        padding: 25px;
        border-radius: 16px;
        box-shadow: var(--shadow);
    }

    h1 {
        text-align: center;
        color: var(--text);
        margin-bottom: 20px;
    }

    form {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    label {
        display: none;
    }

    input {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        outline: none;
        font-size: 14px;
    }

    input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(0,120,255,0.15);
    }

    button {
        padding: 10px 14px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
    }

    form button {
        background: var(--primary);
        color: white;
    }

    form button:hover {
        background: #0066dd;
    }

    ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 10px;
        background: #fff;
    }

    li p {
        margin: 0;
        color: var(--text);
        font-size: 15px;
    }

    .completeBtn {
        background: #e6f0ff;
        color: var(--primary);
        margin-right: 6px;
    }

    .completeBtn:hover {
        background: var(--primary);
        color: white;
    }

    .deleteBtn {
        background: #ffe6e6;
        color: var(--danger);
    }

    .deleteBtn:hover {
        background: var(--danger);
        color: white;
    }
    .done {
        text-decoration: line-through;
        color: var(--muted);
    }
</style>
</head>
<body>
    <div>
        <h1>To-do List</h1>
        <form id="form">
            <label for="inputName">Task</label>
            <input id="inputName" name="inputName" type="text">
            <button type="submit">Add task</button>
        </form>
        <ul id="task-container">
            
        </ul>
    </div>
    <script src="./script.js"></script>
</body>
</html>

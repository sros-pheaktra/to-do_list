<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <h1>Tasks</h1>
      <span class="date-label" id="date-label"></span>
      <div class="progress-card">
      <span id="progress-text">0 / 0 completed</span>

      <div class="progress-bar">
          <div class="progress-fill"></div>
      </div>
  </div>
    </div>
    <div class="stats-row" id="stats-row"></div>
  </div>

  <div class="input-row">
    <input type="text" id="task-input" placeholder="Add a new task…" autocomplete="off" />
    <button class="add-btn" id="add-btn" aria-label="Add task">+</button>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="done">Done</button>
  </div>

  <div class="task-list" id="task-list"></div>
  <div class="clear-row" id="clear-row" style="display:none;">
    <button class="clear-btn" id="clear-done-btn">Clear completed</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
